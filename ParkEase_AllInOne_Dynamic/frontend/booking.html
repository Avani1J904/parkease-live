<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm Booking — ParkEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-custom">
    <div class="container py-2 d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="bi bi-p-square-fill"></i></span>
        <span class="brand-text">ParkEase</span>
      </a>
      <div id="navUserArea" class="d-flex gap-2">
        <a href="parking.html" class="btn btn-outline-custom btn-sm">← Back to Slots</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <div class="small-label">Reservation</div>
      <h1 class="fw-bold mt-2 mb-2">Confirm your booking</h1>
      <p class="text-muted-custom mb-0">Enter your vehicle details and finalize the reservation.</p>
    </div>
  </section>

  <main class="container py-4">
    <div id="bookingAuthNotice" class="d-none"></div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="panel">
          <h5 class="fw-bold mb-4">Vehicle & Slot Details</h5>
          <form id="bookingForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Vehicle Type</label>
                <select id="vehicleType" class="form-select">
                  <option value="CAR">Car</option>
                  <option value="BIKE">Bike</option>
                  <option value="EV">EV Car (Electric)</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Vehicle Registration No</label>
                <input id="vehicleNumber" class="form-control" placeholder="e.g. MP09 AB 1234" value="MP09 AB 1234" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Selected Slot</label>
                <input id="selectedSlot" class="form-control bg-light" value="A-01" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Facility & Zone</label>
                <input id="selectedZone" class="form-control bg-light" value="City Center Parking • Zone A" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Date</label>
                <input id="bookingDate" type="date" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Start Time</label>
                <input id="bookingTime" type="time" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Duration</label>
                <select id="bookingDuration" class="form-select">
                  <option value="1">1 hour</option>
                  <option value="2" selected>2 hours</option>
                  <option value="3">3 hours</option>
                  <option value="4">4 hours</option>
                  <option value="6">6 hours</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Special Request (Optional)</label>
                <textarea id="specialRequest" class="form-control" rows="2" placeholder="e.g. Near entry ramp, EV charging assistance"></textarea>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" required id="bookingTerms" checked>
                  <label for="bookingTerms" class="form-check-label small">
                    I agree to the parking terms, 10-minute hold window, and cancellation rules.
                  </label>
                </div>
              </div>
              <div class="col-12">
                <button id="bookingSubmitBtn" type="submit" class="btn btn-primary-custom btn-lg w-100">
                  Proceed to Payment <i class="bi bi-arrow-right ms-1"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="panel sticky-lg-top" style="top:92px">
          <h5 class="fw-bold mb-3">Reservation Summary</h5>
          <div id="bookingSummaryBox">
            <!-- Dynamically populated by app.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
