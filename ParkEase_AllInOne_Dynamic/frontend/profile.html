<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile — ParkEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-custom">
    <div class="container py-2 d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="bi bi-p-square-fill"></i></span>
        <span class="brand-text">ParkEase</span>
      </a>
      <div id="navUserArea" class="d-flex gap-2">
        <a href="dashboard.html" class="btn btn-outline-custom btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <div class="small-label">Account Settings</div>
      <h1 class="fw-bold mt-2 mb-2">My profile</h1>
      <p class="text-muted-custom mb-0">Manage your personal and vehicle details stored in SQLite.</p>
    </div>
  </section>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="panel text-center">
          <div id="sideProfileAvatar" class="profile-avatar mx-auto mb-3">DR</div>
          <h4 id="sideProfileName" class="fw-bold mb-1">Driver Account</h4>
          <p class="text-muted-custom">Verified Smart Parking Member</p>
          <div class="d-flex justify-content-center gap-2 mt-3">
            <span class="badge badge-soft badge-available">Active</span>
            <span id="sideBookingsBadge" class="badge badge-soft bg-soft text-primary">0 Bookings</span>
          </div>
          <hr class="my-4">
          <div class="text-start">
            <div class="small-label">Registered Email</div>
            <div id="sideProfileEmail" class="fw-semibold mt-1">loading...</div>
            <div class="small-label mt-3">Mobile Phone</div>
            <div id="sideProfileMobile" class="fw-semibold mt-1">loading...</div>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="panel">
          <h5 class="fw-bold mb-4">Edit Personal Information</h5>
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input id="profileFullName" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Email (Immutable)</label>
                <input id="profileEmail" class="form-control bg-light" readonly type="email">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Mobile Number</label>
                <input id="profileMobile" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input id="profileCity" class="form-control" value="Indore">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Default Vehicle Registration Number</label>
                <input id="profileVehicle" class="form-control" placeholder="e.g. MP09 AB 1234">
              </div>
              <div class="col-12">
                <button id="profileSaveBtn" type="submit" class="btn btn-primary-custom">
                  Save Changes
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast">
      <div class="toast-header"><strong class="me-auto">ParkEase</strong><button class="btn-close" data-bs-dismiss="toast"></button></div>
      <div class="toast-body">Profile updated successfully!</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
