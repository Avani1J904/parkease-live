<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History — ParkEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body id="bookingHistoryTable">
  <nav class="navbar navbar-custom">
    <div class="container py-2 d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="bi bi-p-square-fill"></i></span>
        <span class="brand-text">ParkEase</span>
      </a>
      <div id="navUserArea" class="d-flex gap-2">
        <a href="dashboard.html" class="btn btn-outline-custom btn-sm">Dashboard</a>
        <a href="parking.html" class="btn btn-primary-custom btn-sm">Book Parking</a>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <div class="small-label">Account Activity</div>
      <h1 class="fw-bold mt-2 mb-2">Booking history</h1>
      <p class="text-muted-custom mb-0">Live record of all past, active and confirmed reservations.</p>
    </div>
  </section>

  <main class="container py-4">
    <div class="panel mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="small-label mb-1">Search Reservations</label>
          <input id="historySearchInput" class="form-control" placeholder="Search by Booking ID (e.g. PK-2026), slot, or vehicle...">
        </div>
        <div class="col-md-4">
          <label class="small-label mb-1">Filter by Status</label>
          <select id="historyStatusFilter" class="form-select">
            <option value="ALL">All Statuses</option>
            <option value="CONFIRMED">Confirmed (Upcoming)</option>
            <option value="ACTIVE">Active (In Parking)</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="historyApplyBtn" class="btn btn-primary-custom w-100">Filter</button>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead class="table-light">
            <tr>
              <th>Booking ID</th>
              <th>Location</th>
              <th>Date & Time Window</th>
              <th>Slot No</th>
              <th>Amount</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="historyTbody">
            <tr><td colspan="7" class="text-center py-4 text-muted">Loading reservations...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast">
      <div class="toast-header"><strong class="me-auto">ParkEase</strong><button class="btn-close" data-bs-dismiss="toast"></button></div>
      <div class="toast-body">Done.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
